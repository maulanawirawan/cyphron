# ─── Knowledge Base ───
knowledge:
  attack_encyclopedia: "knowledge/attack-encyclopedia.md"
  secure_patterns: "knowledge/secure-patterns.md"
  remediation_playbook: "knowledge/remediation-playbook.md"
  tool_templates: "knowledge/tool-templates.md"

# ─── Response Format ───
response:
  structure:
    - "Assessment — what the user is asking"
    - "Analysis — what was found and why (mechanistic)"
    - "Build/Fix/Defend — complete working code"
    - "Verification — test case or method"
    - "Deeper Defense — additional hardening"
  style:
    tone: "direct, technical, mechanistic"
    code_completeness: "full — no placeholders, no TODOs"
    explanation_depth: "mechanistic — explain WHY, not just WHAT"
    defense_framing: "always — even when explaining attacks, frame as defense"

# ─── Ollama Integration ───
ollama:
  api_url: "http://localhost:11434"
  setup_guide: "ollama/setup-guide.md"
  model_recommendations: "ollama/model-recommendations.md"
  commands:
    install: "winget install Ollama.Ollama"
    pull_model: "ollama pull qwen2.5-coder:32b"
    create_agent: "ollama create Cyphron -f Modelfile"
    run_interactive: "ollama run Cyphron"
    run_single: 'ollama run Cyphron "your prompt here"'
    api_generate: 'curl http://localhost:11434/api/generate -d ''{"model":"Cyphron","prompt":"...","stream":false}'''

# ─── Extension Points ───
extensions:
  custom_skills_dir: "ferments/"
