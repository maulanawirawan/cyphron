name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest
      - run: python -m pytest tests/ -q

  # Issue #1 — coverage diukur & di-badge (angka jujur, dari job summary
  # + badge endpoint di branch gh-pages; hanya di-push saat main).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest pytest-cov
      - name: Run suite with coverage
        run: python -m pytest tests/ -q --cov=core --cov=skills --cov=tools --cov-report=term-missing:skip-covered --cov-report=json:coverage-report.json
      - name: Compute percent + badge JSON
        run: |
          python -c "
          import json, os
          d = json.load(open('coverage-report.json'))
          pct = round(d['totals']['percent_covered'], 1)
          color = 'brightgreen' if pct >= 70 else ('yellow' if pct >= 50 else 'orange')
          json.dump({'schemaVersion': 1, 'label': 'coverage',
                     'message': f'{pct}%', 'color': color},
                    open('coverage-badge.json', 'w'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write(f'## Coverage\n\n**{pct}%** (core + skills + tools)\n')
          print(f'coverage: {pct}%')
          "
      - name: Publish badge to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REPO_URL" gh-pages
            cp coverage-badge.json gh-pages/
            cd gh-pages
            git add coverage-badge.json
            git commit -m "chore: update coverage badge" || echo "no badge change"
            git push origin gh-pages
          else
            mkdir gh-pages
            cp coverage-badge.json gh-pages/
            cd gh-pages
            git init -b gh-pages
            git remote add origin "$REPO_URL"
            git add coverage-badge.json
            git commit -m "chore: bootstrap coverage badge"
            git push --set-upstream origin gh-pages
          fi

  # Issue #2 — Dockerfile di-build dan di-smoke setiap push/PR.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t secai:smoke .
      - name: Smoke — Rust core info (HEALTHCHECK command, exit 0)
        run: docker run --rm secai:smoke info
      - name: Smoke — Rust core validate (exit 2 di input kosong)
        run: |
          docker run --rm secai:smoke validate /dev/null || test $? -eq 2
      - name: Smoke — python registry terbaca di container
        run: |
          docker run --rm --entrypoint python secai:smoke -c "import json; r=json.load(open('skills/registry.json')); print('registry ok:', len(r['skills']), 'skills')"
